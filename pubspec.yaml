name: talktask
description: A voice-driven to-do list app using Flutter
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.5

  # Firebase core + Firestore for real-time sync
  firebase_core: ^2.25.4
  cloud_firestore: ^4.14.0

  # Voice Recognition + Text to Speech
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Connectivity monitoring
  connectivity_plus: ^5.0.2

  # Utilities
  intl: ^0.18.1

  # Material icons, animations
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
